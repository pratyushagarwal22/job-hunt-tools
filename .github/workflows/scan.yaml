name: Job Scanner

on:
  schedule:
    - cron: '7 10 * * *'   # 5:07 AM CDT / 4:07 AM CST
    - cron: '7 20 * * *'   # 3:07 PM CDT / 2:07 PM CST
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Override max_jobs_per_run for this run (blank = settings.yaml value)"
        required: false
        type: string
        default: ""

concurrency:
  group: job-scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode secrets to files
        env:
          GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
          PROFILE_YAML_B64: ${{ secrets.PROFILE_YAML_B64 }}
          CANDIDATE_MD_B64: ${{ secrets.CANDIDATE_MD_B64 }}
        run: |
          set -euo pipefail
          mkdir -p config
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_B64" | base64 --decode > service_account.json
          printf '%s' "$PROFILE_YAML_B64" | base64 --decode > config/profile.yaml
          printf '%s' "$CANDIDATE_MD_B64" | base64 --decode > config/candidate.md
          for file in service_account.json config/profile.yaml config/candidate.md; do
            if ! test -s "$file"; then
              echo "::error::$file is empty (missing secret?)"
              exit 1
            fi
          done

      - name: Run scanner
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          MAX_JOBS: ${{ inputs.max_jobs }}
        run: |
          if [ -n "$MAX_JOBS" ]; then
            python -m job_scanner.main --max-jobs "$MAX_JOBS"
          else
            python -m job_scanner.main
          fi
