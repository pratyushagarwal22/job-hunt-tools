# Search queries — one per job board site, plus company_sites for big companies.
# Each query uses site: filter + SWE-family role titles.
# No "remote", no years, no visa terms (the scorer handles visa).
# Serper passes these to Google with tbs=qdr:d (past 24 hours).

queries:
  - name: Greenhouse (job-boards)
    query: 'site:job-boards.greenhouse.io ("Software Engineer" OR "Software Developer" OR "Software Development Engineer" OR "Forward Deployed Engineer" OR "Founding Engineer" OR "Product Engineer" OR "AI Engineer" OR "New Grad")'
    enabled: true

  - name: Greenhouse (boards)
    query: 'site:boards.greenhouse.io ("Software Engineer" OR "Software Developer" OR "Software Development Engineer" OR "Forward Deployed Engineer" OR "Founding Engineer" OR "Product Engineer" OR "AI Engineer" OR "New Grad")'
