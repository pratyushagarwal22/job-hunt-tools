# Pipeline settings — committed to repo.
# Personal data belongs in config/profile.yaml (gitignored).

max_jobs_per_run: 50

max_pages_per_query: 2

ats_lookback_days: 3

request_timeout_seconds: 15

jd_min_chars: 500

timezone: America/Chicago

scoring:
  model: claude-haiku-4-5-20251001
  max_tokens: 1024
  max_jd_chars: 15000

title_filter:
  # At least one include keyword must match AND zero exclude keywords must match.
  # Matching is case-insensitive and whole-word (e.g. "Lead" does not match "Leadership").
  include:
    - "Software Engineer"
    - "Software Developer"
    - "Software Development Engineer"
    - "SWE"
    - "SDE"
    - "New Grad"
    - "Forward Deployed"
    - "Founding Engineer"
    - "Product Engineer"
    - "AI Engineer"
    - "Applied AI"
    - "Full Stack"
    - "Full-Stack"
    - "Fullstack"
    - "Backend"
    - "Associate Software Engineer"
    - "Associate Software Developer"
    - "Associate Software Development Engineer"
    - "Junior Software Engineer"
    - "Software Engineer I"
    - "SDE I"
  exclude:
    - "Staff"
    - "Principal"
    - "Lead"
    - "Manager"
    - "Director"
    - "VP"
    - "Head of"
    - "Intern"
    - "Internship"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "Mainframe"
    - "COBOL"

location_filter:
  # Drop a job only if its location contains one of these keywords.
  # Matching is case-insensitive and whole-word.
  # Jobs with US locations, "Remote", "Remote - US", or blank/unknown pass through.
  # Names shared with a US place that posts real software jobs are only matched in
  # narrowed forms: Mexico (New Mexico), Dublin (Dublin CA/OH), Vancouver (Vancouver WA).
  # No bare "Ontario" (Ontario CA) or "England" (New England).
  exclude:
    # Regions
    - "EMEA"
    - "APAC"
    - "LATAM"
    - "Europe"
    # UK / Ireland
    - "UK"
    - "United Kingdom"
    - "London"
    - "Ireland"
    # Canada
    - "Canada"
    - "Toronto"
    - "Vancouver, BC"
    - "British Columbia"
    - "Montreal"
    - "Montréal"
    - "Quebec"
    - "Québec"
    # India
    - "India"
    - "Bangalore"
    - "Bengaluru"
    - "Hyderabad"
    - "Pune"
    # Europe
    - "Germany"
    - "Berlin"
    - "Munich"
    - "München"
    - "France"
    - "Paris"
    - "Netherlands"
    - "Amsterdam"
    - "Spain"
    - "Madrid"
    - "Barcelona"
    - "Switzerland"
    - "Zurich"
    - "Zürich"
    - "Poland"
    - "Polska"
    - "Warsaw"
    - "Warszawa"
    - "Krakow"
    - "Kraków"
    - "Wroclaw"
    - "Wrocław"
    - "Gdansk"
    - "Gdańsk"
    # Middle East / Africa
    - "Israel"
    - "Tel Aviv"
    - "Haifa"
    - "Egypt"
    # Asia-Pacific
    - "Singapore"
    - "Australia"
    - "Sydney"
    - "Japan"
    - "Tokyo"
    - "Taiwan"
    - "Taipei"
    - "China"
    - "Korea"
    - "Seoul"
    - "Shanghai"
    - "Beijing"
    # Latin America
    - "Mexico City"
    - "CDMX"
    - "Guadalajara"
    - "Monterrey"
    - "Brazil"
    - "Brasil"
    - "Sao Paulo"
    - "São Paulo"
    - "Rio de Janeiro"
