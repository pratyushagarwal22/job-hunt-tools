# Pipeline settings — committed to repo.
# Personal data belongs in config/profile.yaml (gitignored).

max_jobs_per_run: 150

max_pages_per_query: 4

search:
  tbs: "qdr:d"  # past 24 hours
  gl: us        # search origin, not a job-location filter
  num: 10       # results per page

ats_lookback_days: 2

request_timeout_seconds: 15

jd_min_chars: 500

timezone: America/Chicago

scoring:
  model: claude-opus-5-5
  # true: forced tool call (Haiku). false: tool_choice auto + strict tool, for models that
  # reject a forced tool_choice (Sonnet/Opus 5.5).
  force_tool_choice: false
  max_tokens: 2048
  max_jd_chars: 15000

# USD per million tokens, keyed by model ID. Used for the COST log line; a model with no
# entry logs "cost unknown".
prices:
  claude-haiku-4-5-20251001:
    input: 1.00
    output: 5.00
    cache_write: 1.25
    cache_read: 0.10
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write: 2.50
    cache_read: 0.20
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_write: 5.00
    cache_read: 0.20

experience_filter:
  # Drop a job before scoring when its JD (or title + snippet) requires more years than this.
  # No stated requirement → keep.
  max_years_required: 2

title_filter:
  # At least one include keyword must match AND zero exclude keywords must match.
  # Matching is case-insensitive and whole-word (e.g. "Lead" does not match "Leadership").
  include:
    - "Software Engineer"
    - "Software Developer"
    - "Software Development Engineer"
    - "Software Dev Engineer"
    - "SWE"
    - "SDE"
    - "New Grad"
    - "Early Career"
    - "Early-Career"
    - "Forward Deployed"
    - "Founding Engineer"
    - "Product Engineer"
    - "AI Engineer"
    - "Applied AI"
    - "Full Stack"
    - "Full-Stack"
    - "Fullstack"
    - "Backend"
    - "Associate Software Engineer"
    - "Associate Software Developer"
    - "Associate Software Development Engineer"
    - "Junior Software Engineer"
    - "Software Engineer I"
    - "SDE I"
    - "Developer"
    - "Frontend"
    - "Front End"
    - "Front-End"
    - "UI Engineer"
    - "Mobile Engineer"
    - "iOS"
    - "Android"
  # Each phrase counts as an include match and is removed before the exclude check,
  # so "Member of Technical Staff" passes but "Senior Member of Technical Staff" drops.
  always_allow:
    - "Member of Technical Staff"
  exclude:
    - "Senior"
    - "Sr"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Manager"
    - "Director"
    - "VP"
    - "Head of"
    - "Intern"
    - "Internship"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "Mainframe"
    - "COBOL"
    - "RN"
    - "Nurse"
    - "Nursing"
    - "Developer Advocate"
    - "Developer Relations"
    - "Business Developer"

location_filter:
  # Drop a job only if an exclude keyword matches AND no us_signals entry appears in any
  # checked field (ATS: location; search: title + raw URL, never the snippet).
  # Matching is case-insensitive and whole-word.
  # Jobs with US locations, "Remote", "Remote - US", or blank/unknown pass through.
  # No bare "US" or two-letter state codes in us_signals ("us" matches "join us");
  # no "Georgia" (the country).
  us_signals:
    - "United States"
    - "USA"
    - "U.S."
    - "Remote - US"
    - "Remote (US)"
    - "US Remote"
    # States
    - "Alabama"
    - "Alaska"
    - "Arizona"
    - "Arkansas"
    - "California"
    - "Colorado"
    - "Connecticut"
    - "Delaware"
    - "Florida"
    - "Hawaii"
    - "Idaho"
    - "Illinois"
    - "Indiana"
    - "Iowa"
    - "Kansas"
    - "Kentucky"
    - "Louisiana"
    - "Maine"
    - "Maryland"
    - "Massachusetts"
    - "Michigan"
    - "Minnesota"
    - "Mississippi"
    - "Missouri"
    - "Montana"
    - "Nebraska"
    - "Nevada"
    - "New Hampshire"
    - "New Jersey"
    - "New Mexico"
    - "New York"
    - "North Carolina"
    - "North Dakota"
    - "Ohio"
